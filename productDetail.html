<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="productCSS.css">
    </head>
    <body>
        <header>

            <div id="sodaTradeHeader1"></div>

            <script>
    fetch("sodaTradeHeader.html")
    .then(res => res.text())
    .then(data => {
        document.getElementById('sodaTradeHeader1').innerHTML = data;
        if (window.updateHeaderAuth) window.updateHeaderAuth();
        if (window.updateCartCount) window.updateCartCount();
    })
</script>

        </header>

        <div class="productDetail">
            <img id="detailImage" src="" alt="">
            <h2 id="detailName"></h2>
            <p id="detailPrice"></p>
            <p id="detailDescription"></p>
            <select id="detailVariant" style="display:none;"></select>
            
            <button id="detailAddToCart">Add to Cart</button>
        </div>

        <footer></footer>

        <script src="authJS.js"></script>
<script src="productDetailJS.js"></script>
    </body>
</html>
